<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeros - Vista AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #1a1a1a; font-family: sans-serif; }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }
    .ar-button {
      background-color: #ffffff;
      border-radius: 8px;
      border: none;
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <model-viewer
    src="Jeros_2.glb"
    alt="Modelo 3D Jeros"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1"
  >
    <button slot="ar-button" class="ar-button">Ver en AR 📱</button>
  </model-viewer>
</body>
</html>
